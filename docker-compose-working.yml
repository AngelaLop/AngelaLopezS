services:
  jekyll:
    image: jekyll/jekyll:4.2.2
    command: sh -c "bundle install && bundle exec jekyll serve --host 0.0.0.0 --port 4000 --livereload --livereload-port 35729 --force_polling"
    ports:
      - 8080:4000
      - 35729:35729
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development

